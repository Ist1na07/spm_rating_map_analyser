    function showLoading(msg) {
        if (hideOnPlayActive) return;
        elLoading.textContent = msg || 'SPM Map Analyser';
        if (cachedResult && msg === 'Loading analysis...') {
            elContainer.classList.add('is-updating');
            if (delayedLoadingTimer) clearTimeout(delayedLoadingTimer);
            delayedLoadingTimer = setTimeout(() => {
                if (analysisPending && cachedResult) {
                    elContainer.classList.add('hidden');
                    elLoading.classList.remove('hidden');
                }
            }, 140);
            return;
        }
        if (delayedLoadingTimer) {
            clearTimeout(delayedLoadingTimer);
            delayedLoadingTimer = null;
        }
        elContainer.classList.remove('is-updating');
        elContainer.classList.add('hidden');
        elLoading.classList.remove('hidden');
    }

    function rebuildCurves() {
        if (!cachedRawCurves || !cachedResult) return;
        const morphActive = curveMorphFrom && (performance.now() - curveMorphStartTs) < 40;
        if (settings.enableAnimations && !morphActive) {
            if (lastSmoothedSnapshot) {
                curveMorphFrom = lastSmoothedSnapshot;
                curveMorphStartTs = performance.now();
            } else if (cachedRawCurves.sectionDifficulties && cachedRawCurves.sectionDifficulties.length) {
                const n = cachedRawCurves.sectionDifficulties.length;
                curveMorphFrom = {
                    sec: new Float64Array(n),
                    rc: cachedRawCurves.rcSectionDifficulties ? new Float64Array(cachedRawCurves.rcSectionDifficulties.length) : null,
                    ln: cachedRawCurves.lnSectionDifficulties ? new Float64Array(cachedRawCurves.lnSectionDifficulties.length) : null,
                    scale: 0,
                };
                curveMorphStartTs = performance.now();
            }
        }
        offscreenValid = false;
        const px = smoothPx();
        const w = curveInnerWidth();
        cachedResult.sectionDifficulties = SPMEngine.smoothCurve(
            cachedRawCurves.sectionDifficulties, px, w, SPMEngine.CURVE_FILL_RUN_MAX);
        cachedResult.rcSectionDifficulties = SPMEngine.smoothCurve(
            cachedRawCurves.rcSectionDifficulties, px, w, SPMEngine.CURVE_FILL_RUN_MAX);
        cachedResult.lnSectionDifficulties = cachedRawCurves.lnSectionDifficulties
            ? SPMEngine.smoothCurve(cachedRawCurves.lnSectionDifficulties, px, w, 0) : null;
        cachedSegStats = cachedTagResult
            ? SPMEngine.computeSegmentStats(cachedTagResult.segments, {
                sectionTimes: cachedResult.sectionTimes,
                sectionDifficulties: cachedRawCurves.sectionDifficulties,
                keyCount: cachedResult.keyCount,
            })
            : null;
        segmentDiffFloor = 0.35 * medianOfPositive(cachedRawCurves.sectionDifficulties);
        curveScaleMax = Math.max(
            safeMax(cachedRawCurves.sectionDifficulties),
            safeMax(cachedRawCurves.rcSectionDifficulties),
            cachedRawCurves.lnSectionDifficulties ? safeMax(cachedRawCurves.lnSectionDifficulties) : 0,
            0.01);
        lastSmoothedSnapshot = {
            sec: cachedResult.sectionDifficulties,
            rc: cachedResult.rcSectionDifficulties,
            ln: cachedResult.lnSectionDifficulties,
            scale: curveScaleMax,
        };
    }

    function medianOfPositive(arr) {
        if (!arr || !arr.length) return 0;
        const pos = [];
        for (let i = 0; i < arr.length; i++) if (arr[i] > 0) pos.push(arr[i]);
        if (!pos.length) return 0;
        pos.sort((a, b) => a - b);
        return pos[pos.length >> 1];
    }

    function curveInnerWidth() {
        const w = elCanvas.clientWidth - 8;
        return w > 8 ? w : SPMEngine.CURVE_INNER_W;
    }

    let lastCurveWidth = 0;
    function maybeResizeCurves() {
        if (!cachedResult || !cachedRawCurves) return;
        const w = curveInnerWidth();
        if (Math.abs(w - lastCurveWidth) < 1) return;
        lastCurveWidth = w;
        rebuildCurves();
        lastSegIndex = -2;
        if (cachedTagResult) renderSegTimeline(cachedTagResult);
        startAnimationLoop();
    }

    function cacheIndicator(state, reason='') {
        const prevState = elContainer.dataset.cacheState;
        elContainer.dataset.cacheState = state;
        elCacheStatus.textContent = ({hit:'Cached', saved:'Saved', miss:'Calculated', off:'Cache off', ready:'Cache on', unavailable:'No cache'})[state] || '';
        elCacheStatus.title = reason || ({
            hit:'Loaded from local disk after checking the current .osu contents',
            saved:'Analysis saved locally; selecting this unchanged chart again skips calculation',
            miss:'Fresh analysis; saving a compressed local copy',
            off:'Local analysis cache is disabled; existing cache data has been cleared',
            ready:'Local analysis cache is enabled for the next selection',
        })[state] || cacheUnavailableReason;
        if (settings.enableAnimations && prevState && prevState !== state && elCacheStatus.textContent) {
            elCacheStatus.classList.remove('cache-pulse');
            void elCacheStatus.offsetWidth;
            elCacheStatus.classList.add('cache-pulse');
        }
    }
    function cacheUnavailable(error) {
        cacheUnavailableReason = String(error?.message || error);
        console.warn('SPM Map Analyser: local cache unavailable:', cacheUnavailableReason);
        if (settings.enableAnalysisCache) cacheIndicator('unavailable', cacheUnavailableReason);
    }

    async function fetchAndRate(speedRate, frame=currentBeatmapFrame) {
        if (!frame) return;
        const serial = ++analysisSerial;
        const options = {model:algorithmModel(), subDifficultyScheme:currentSubScheme()};
        const variant = JSON.stringify([options.model, options.subDifficultyScheme, speedRate]);
        const selectionKey = currentSelectionKey;
        const isCurrent = () => serial === analysisSerial && options.model === algorithmModel()
            && options.subDifficultyScheme === currentSubScheme();
        analysisPending = true; pendingOptions = options;
        try {
            // Re-read even on hits: tosu's checksum can lag edits.
            const resp = await fetch(`http://localhost:${TOSU_PORT}/files/beatmap/file`, {cache:'no-store'});
            if (!isCurrent()) return;
            if (!resp.ok) throw Error('Failed to fetch .osu');
            const content = await resp.text();
            if (!isCurrent()) return;
            if (!content || content.length < 50) throw Error('Empty .osu file');
            if (!SPMAnalysisCache.matches(content,frame)) throw Error('Beatmap changed while loading; waiting for the current map');
            await runtimeReady;
            if (!isCurrent()) return;
            let digest = null, analysis = null;
            if (settings.enableAnalysisCache && frame.id && cacheStore?.available) {
                try { digest = await SPMAnalysisCache.fingerprint(content); }
                catch (e) { cacheUnavailable(e); }
                if (!isCurrent()) return;
                if (digest) analysis = await cacheStore.get(frame.id,digest,variant,isCurrent);
                if (!isCurrent()) return;
            }
            const hit = !!analysis;
            if (!analysis) analysis = calculateAnalysis(content,speedRate,options);
            if (!analysis.result) {
                cachedResult = cachedRawCurves = cachedTagResult = cachedSegStats = null;
                lastSmoothedSnapshot = null;
                showLoading('No notes found'); return;
            }
            // Snapshot raw data before the renderer prepares smoothed curves.
            const toStore = !hit && digest && analysis.tags
                ? SPMAnalysisCache.snapshot(analysis.result,analysis.tags) : null;
            cachedOsuContent = content;
            cachedKeyCount = analysis.result.keyCount;
            cachedMeta = SPMEngine.parseOsuMeta(content);
            cachedTagResult = analysis.tags;
            cachedResult = analysis.result;
            // Disk hits skip processMap, which normally selects the dan table.
            SPMEngine.setDanVariant(options.model);
            cachedRawCurves = {
                sectionDifficulties: cachedResult.sectionDifficulties,
                rcSectionDifficulties: cachedResult.rcSectionDifficulties,
                lnSectionDifficulties: cachedResult.lnSectionDifficulties,
            };
            curvesDirty = true;
            showResult(cachedResult);
            cacheIndicator(!settings.enableAnalysisCache ? 'off' : hit ? 'hit'
                : !digest || !cacheStore?.available ? 'unavailable' : 'miss',
                !frame.id ? 'tosu must provide the folder-qualified beatmap path for persistent caching' : '');
            if (toStore) void cacheStore.put(frame.id,digest,variant,toStore,isCurrent).then(saved => {
                if (isCurrent() && settings.enableAnalysisCache) {
                    if (saved) cacheIndicator('saved');
                    else if (!cacheStore.available) cacheIndicator('unavailable');
                }
            });
        } catch (e) {
            if (!isCurrent()) return;
            console.warn('SPM Map Analyser:', e);
            failedSelectionKey = selectionKey; retryAfter = performance.now()+1000;
            currentSelectionKey = null;
            showLoading(e.message);
        } finally {
            if (serial === analysisSerial) { analysisPending = false; pendingOptions = null; }
        }
    }

    /** Pure calculation; cache hits bypass both engines, not just rating. */
    function calculateAnalysis(content, speedRate, options) {
        const keyCount = parseKeyCount(content);
        const result = processMap(content, 'full', speedRate, {
            ...options, includeTagEvidence:keyCount === 7,
        });
        let tags = null;
        if (result && [4,6,7].includes(keyCount) && typeof TagClassifier !== 'undefined') {
            try {
                tags = TagClassifier.analyzeMap(content, {
                    speedRate, ...(keyCount === 7 ? {ratingEvidence:result.tagEvidence} : {}),
                });
            } catch (e) { console.error('SPM Map Analyser: perception classification failed:', e); }
        }
        if (result) {
            result.classified = tags != null;
            if (result.classified && tags.overall.tags.length)
                result.mapType = String(tags.overall.sort || '').toUpperCase() || result.mapType;
            result.subDifficultyScheme = options.subDifficultyScheme;
        }
        return {result,tags};
    }

    function startAnimationLoop() {
        if (animFrameId || document.hidden || hideOnPlayActive
            || elContainer.classList.contains('hidden') || settings.uiStyle === 'Minimal') return;
        animFrameId = requestAnimationFrame(() => {
            animFrameId = null;
            if (!cachedResult || document.hidden || hideOnPlayActive
                || elContainer.classList.contains('hidden') || settings.uiStyle === 'Minimal') return;
            const cursorTime = getInterpolatedTime();
            drawCurve(
                cachedResult.sectionDifficulties, cachedResult.rcSectionDifficulties,
                cachedResult.mapType, cursorTime, cachedResult.sectionTimes,
                cachedResult.firstNoteTime, cachedResult.lastNoteTime,
                cachedResult.lnSectionDifficulties
            );
            updateSegmentLive(cursorTime);
            const moving = !isPaused && songTimeMs !== null
                && (prevSongTimeMs === null || songTimeMs !== prevSongTimeMs)
                && performance.now() - songTimeReceiveTs < 1000
                && cursorTime < cachedResult.lastNoteTime;
            if (moving || curveMorphFrom) startAnimationLoop();
        });
    }

    function stopAnimationLoop() {
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }
    }

    /** Apply a settings dict ({uniqueID: value}) received from tosu. */
    function applySettingsDict(d) {
        if (!d || typeof d !== 'object') return false;
        let changed = false;
        if (typeof d.algorithm === 'string') {
            changed = changed || settings.algorithm !== d.algorithm;
            settings.algorithm = d.algorithm;
        }
        if (typeof d.subDifficultyScheme === 'string') {
            changed = changed || settings.subDifficultyScheme !== d.subDifficultyScheme;
            settings.subDifficultyScheme = d.subDifficultyScheme;
        }
        if ('enableAnalysisCache' in d) {
            const enabled = !!d.enableAnalysisCache;
            if (settings.enableAnalysisCache !== enabled) {
                settings.enableAnalysisCache = enabled; changed = true;
                if (cacheStore) void cacheStore.setEnabled(enabled);
                cacheIndicator(enabled ? 'ready' : 'off');
            }
        }
        if (typeof d.danDisplayStyle === 'string') {
            changed = changed || settings.danDisplayStyle !== d.danDisplayStyle;
            settings.danDisplayStyle = d.danDisplayStyle;
        }
        if (typeof d.colorScheme === 'string') {
            if (settings.colorScheme !== d.colorScheme) {
                changed = true;
                settings.colorScheme = d.colorScheme;
                applyColorScheme(settings.colorScheme);
            }
        }
        if (typeof d.uiStyle === 'string') {
            changed = changed || settings.uiStyle !== d.uiStyle;
            settings.uiStyle = d.uiStyle;
        }
        if (typeof d.panelDensity === 'string') {
            changed = changed || settings.panelDensity !== d.panelDensity;
            settings.panelDensity = d.panelDensity;
        }
        if (typeof d.curveSmoothing === 'string') {
            changed = changed || settings.curveSmoothing !== d.curveSmoothing;
            if (settings.curveSmoothing !== d.curveSmoothing) curvesDirty = true;
            settings.curveSmoothing = d.curveSmoothing;
        }
        if ('enableAnimations' in d) {
            const ea = !!d.enableAnimations;
            if (settings.enableAnimations !== ea) {
                changed = true;
                settings.enableAnimations = ea;
                applyMotionSetting();
                offscreenValid = false;
                lastDrawnCursorX = -999;
            }
        }
        if ('hideOnPlay' in d) {
            changed = changed || settings.hideOnPlay !== !!d.hideOnPlay;
            settings.hideOnPlay = !!d.hideOnPlay;
        }
        if ('showSummary' in d) {
            changed = changed || settings.showSummary !== !!d.showSummary;
            settings.showSummary = !!d.showSummary;
        }
        if ('showTags' in d) {
            changed = changed || settings.showTags !== !!d.showTags;
            settings.showTags = !!d.showTags;
        }
        if ('showSegmentTag' in d) {
            changed = changed || settings.showSegmentTag !== !!d.showSegmentTag;
            settings.showSegmentTag = !!d.showSegmentTag;
        }
        if ('showSegmentDiff' in d) {
            changed = changed || settings.showSegmentDiff !== !!d.showSegmentDiff;
            settings.showSegmentDiff = !!d.showSegmentDiff;
        }
        if ('showTimeline' in d) {
            changed = changed || settings.showTimeline !== !!d.showTimeline;
            settings.showTimeline = !!d.showTimeline;
        }
        if ('showBreak' in d) {
            changed = changed || settings.showBreak !== !!d.showBreak;
            settings.showBreak = !!d.showBreak;
        }
        if (!settings.hideOnPlay && hideOnPlayActive) {
            hideOnPlayActive = false;
            changed = true;
        }
        return changed;
    }

    function ratingSettingsChanged() {
        if (pendingOptions) return pendingOptions.model !== algorithmModel()
            || pendingOptions.subDifficultyScheme !== currentSubScheme();
        if (!cachedResult) return false;
        if (cachedResult.modelVariant !== algorithmModel()) return true;
        if (cachedResult.subDifficultyScheme !== currentSubScheme()) return true;
        return false;
    }

    function reapplySettingsToUI() {
        applyColorScheme(settings.colorScheme);
        applyUiStyle();
        applyClassificationVisibility();
        if ((cachedOsuContent || analysisPending) && ratingSettingsChanged()) {
            showLoading('Loading analysis...');
            void fetchAndRate(currentSpeedRate || 1.0);
            return;
        }
        if (analysisPending) return;
        if (cachedResult) {
            lastSegIndex = -2;
            showResult(cachedResult);
        }
    }

    let settingsWs = null;
    let settingsPollTimer = null;
    let lastSettingsJson = null;
    let hasReceivedSettings = false;

    function handleSettingsMessage(event) {
        let data;
        try { data = JSON.parse(event.data); } catch { return; }
        const message = data && data.message;
        if (!message || typeof message !== 'object') return;
        if (message.error) {
            const model = algorithmModel() === 'compact' ? 'Compact' : 'Detailed';
            elSettingsWarning.textContent = 'Settings unavailable — '
                + (hasReceivedSettings ? 'keeping ' + model : model + ' defaults');
            elSettingsWarning.title = String(message.error)
                + '\nInstall the overlay folder directly under tosu/static; nested folders may prevent tosu from creating its settings file.';
            elSettingsWarning.classList.remove('hidden');
            return;
        }
        hasReceivedSettings = true;
        elSettingsWarning.classList.add('hidden');
        const next = JSON.stringify(message);
        if (next === lastSettingsJson) return;
        const firstLoad = lastSettingsJson === null;
        lastSettingsJson = next;
        applySettingsDict(message);
        if (!firstLoad) reapplySettingsToUI();
        else if (cachedResult || analysisPending) reapplySettingsToUI();
    }

    function sendGetSettings() {
        if (settingsWs && settingsWs.readyState === 1) {
            settingsWs.send(`getSettings:${counterPath || ''}`);
        }
    }

    function connectSettings() {
        try {
            settingsWs = new WebSocket(
                `ws://localhost:${TOSU_PORT}/websocket/commands?l=${encodeURIComponent(counterPath || '')}`);
        } catch { return; }
        settingsWs.onopen = sendGetSettings;
        settingsWs.onmessage = handleSettingsMessage;
        settingsWs.onclose = () => { settingsWs = null; };
        settingsWs.onerror = () => { try { settingsWs && settingsWs.close(); } catch { /* noop */ } };
    }

    function startSettingsPolling() {
        if (settingsPollTimer) return;
        settingsPollTimer = setInterval(() => {
            if (!settingsWs || settingsWs.readyState > 1) {
                lastSettingsJson = null;
                connectSettings();
            } else if (settingsWs.readyState === 1) {
                sendGetSettings();
            }
        }, 2000);
    }

    function connect() {
        if (ws && ws.readyState <= 1) return;

        ws = new WebSocket(`ws://localhost:${TOSU_PORT}/websocket/v2`);

        ws.onopen = () => {
            console.log('SPM Map Analyser: Connected to tosu');
            showLoading('Connected');
        };

        ws.onmessage = (event) => {
            let data;
            try { data = JSON.parse(event.data); } catch { return; }

            const checksum = data.beatmap?.checksum;
            const frame = SPMAnalysisCache.frame(data);
            const selectionKey = JSON.stringify([frame.id, checksum]);
            currentBeatmapFrame = frame;
            const mode = data.beatmap?.mode?.number;

            capturePayloadMeta(data);
            isPaused = !!(data && data.game && data.game.paused);

            const modData = getModData(data);
            const liveTimeMs = extractSongTimeMs(data);

            if (Number.isFinite(liveTimeMs)) {
                const scaledTime = liveTimeMs / modData.speedRate;
                prevSongTimeMs = songTimeMs;
                prevSongTimeReceiveTs = songTimeReceiveTs;
                songTimeMs = scaledTime;
                songTimeReceiveTs = performance.now();
            }

            if (mode !== 3) {
                analysisSerial++; analysisPending = false; pendingOptions = null;
                currentSelectionKey = null;
                if (cachedResult !== null) {
                    cachedResult = null;
                    cachedRawCurves = null;
                    cachedTagResult = null;
                    cachedSegStats = null;
                    cachedMeta = null;
                    cachedPayloadMeta = null;
                    lastSmoothedSnapshot = null;
                    stopAnimationLoop();
                    showLoading('Not Mania');
                }
                return;
            }

            const stateName = String(data?.state?.name || '').toLowerCase();
            const returnedFromEditor = /edit/i.test(lastStateName) && !/edit/i.test(stateName);
            lastStateName = stateName;
            const isPlay = stateName === 'play';
            if (settings.hideOnPlay && isPlay) {
                elContainer.classList.add('hidden');
                elLoading.classList.add('hidden');
                hideOnPlayActive = true;
            } else if (hideOnPlayActive && !isPlay) {
                hideOnPlayActive = false;
            }

            const needsRecalc = checksum && (
                (selectionKey !== currentSelectionKey && (selectionKey !== failedSelectionKey || performance.now() >= retryAfter))
                || modData.modSignature !== currentModSignature
                || returnedFromEditor
            );

            if (needsRecalc) {
                currentChecksum = checksum;
                currentSelectionKey = selectionKey;
                currentModSignature = modData.modSignature;
                currentSpeedRate = modData.speedRate;

                if (modData.speedRate !== 1.0) {
                    const displayCodes = modData.modCodes.includes('NC')
                        ? modData.modCodes.filter(c => c !== 'DT')
                        : modData.modCodes;
                    const modText = displayCodes.length > 0
                        ? displayCodes.join('+') + ' ' + modData.speedRate.toFixed(2) + 'x'
                        : modData.speedRate.toFixed(2) + 'x';
                    setMorphText(elModBadge, modText);
                    elModBadge.classList.remove('hidden');
                } else {
                    elModBadge.dataset.rawVal = '';
                    elModBadge.classList.add('hidden');
                }

                showLoading('Loading analysis...');
                void fetchAndRate(modData.speedRate, frame);
                startAnimationLoop();
            } else if (cachedResult && !analysisPending && elContainer.classList.contains('hidden') && !hideOnPlayActive) {
                showResult(cachedResult);
                startAnimationLoop();
            } else if (cachedResult && !hideOnPlayActive && Number.isFinite(liveTimeMs)) {
                updateSegmentLive(getInterpolatedTime());
                startAnimationLoop();
            }
        };

        ws.onclose = () => {
            console.log('SPM Map Analyser: Disconnected');
            analysisSerial++; analysisPending = false; pendingOptions = null;
            currentSelectionKey = null;
            stopAnimationLoop();
            showLoading('Disconnected');
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connect, 2000);
        };

        ws.onerror = () => {
            ws.close();
        };
    }

    async function loadDanConstants() {
        try {
            const res = await fetch('dan_constants.json', {cache:'no-store'});
            if (!res.ok) return 'inlined';
            const constants = await res.json();
            SPMEngine.loadDanConstants(constants);
            return JSON.stringify(constants);
        } catch { /* keep inlined defaults */ }
        return 'inlined';
    }
    async function initializeCache() {
        const constants = await loadDanConstants();
        try {
            const response = await fetch('metadata.txt', {cache:'no-store'});
            if (!response.ok) throw Error('Cannot verify analyser version; local cache disabled');
            const version = (await response.text()).match(/^version:\s*(\S+)\s*$/m)?.[1];
            cacheStore = SPMAnalysisCache.create({version,signature:constants,onUnavailable:cacheUnavailable});
            await cacheStore.ready;
            await cacheStore.setEnabled(settings.enableAnalysisCache);
        } catch (e) { cacheUnavailable(e); }
    }

    applyColorScheme(settings.colorScheme);
    applyUiStyle();

    window.addEventListener('resize', maybeResizeCurves);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopAnimationLoop();
        else startAnimationLoop();
    });

    showLoading('Connecting to tosu...');
    connectSettings();
    startSettingsPolling();
    const runtimeReady = initializeCache();
    connect();
    window.addEventListener('focus', () => {
        if (currentBeatmapFrame && cachedResult && !analysisPending) void fetchAndRate(currentSpeedRate || 1);
    });
})();
</script>
</body>
</html>
