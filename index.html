<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    /* Flat instrument tokens. One font, flat surfaces, hairline rules;
       colour is reserved for meaning (family, tag, status). Each Colour
       Scheme rewrites these while keeping WCAG 4.5:1 text contrast. */
    --panel-bg: rgba(13, 16, 22, 0.84);
    --panel-border: rgba(255, 255, 255, 0.10);
    --panel-radius: 10px;
    --panel-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --text: #eef1f5;
    --text-dim: rgba(238, 241, 245, 0.64);
    --text-faint: rgba(238, 241, 245, 0.46);
    --rule: rgba(255, 255, 255, 0.08);
    --surface: rgba(255, 255, 255, 0.04);
    --surface-strong: rgba(255, 255, 255, 0.07);
    --surface-border: rgba(255, 255, 255, 0.09);
    --chip-track: rgba(255, 255, 255, 0.055);
    --pill: rgba(255, 255, 255, 0.10);
    --pill-border: rgba(255, 255, 255, 0.15);
    --grid-line: rgba(255, 255, 255, 0.06);
    --cursor: #ffffff;
    --break: #454b54;
    --break-text: #5b6470;
    --rc: #58a6ff;
    --ln: #ff8c5a;
    --hb: #c7cdd6;
    --mix: #8f97a3;
    --badge-ink: #14171c;
    --dim-text: #ffffff;
    --segdiff: #eef1f5;
    --bar-s0: 100%;
    --bar-s1: 100%;
    --bar-hb-col: rgba(199, 205, 214, 0);
    /* Single type system: one UI stack for every label and number, with
       tabular figures so values align and roll without width jitter. */
    --font-ui: 'Segoe UI Variable Display', 'Segoe UI', 'Inter', 'Yu Gothic UI', 'Meiryo', 'Microsoft YaHei UI', sans-serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-roll: cubic-bezier(0.16, 1, 0.3, 1);
    --hero-size: 44px;
    --sub-size: 21px;
    --curve-h: 84px;
    --dan-size: 13.5px;
}
@property --bar-s0 {
    syntax: '<percentage>';
    inherits: true;
    initial-value: 100%;
}
@property --bar-s1 {
    syntax: '<percentage>';
    inherits: true;
    initial-value: 100%;
}
@property --bar-hb-col {
    syntax: '<color>';
    inherits: true;
    initial-value: rgba(199, 205, 214, 0);
}
body {
    background: transparent;
    color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
}

/* ---------- Panel Shell ---------- */
#container {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 13px 16px 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--panel-radius);
    backdrop-filter: blur(10px);
    box-shadow: var(--panel-shadow);
    min-width: 380px;
    transition: background-color 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease, padding 0.22s ease, gap 0.22s ease;
}
/* Top edge = live RC/LN family split (data, not decoration). */
#container::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 2px;
    background:
        linear-gradient(90deg,
            transparent calc(var(--bar-s0) - 9%),
            var(--bar-hb-col) calc((var(--bar-s0) + var(--bar-s1)) / 2),
            transparent calc(var(--bar-s1) + 9%)),
        linear-gradient(90deg,
            var(--rc) 0%,
            var(--rc) var(--bar-s0),
            var(--ln) var(--bar-s1),
            var(--ln) 100%);
    pointer-events: none;
    z-index: 2;
    transition: --bar-s0 0.45s var(--ease-out),
                --bar-s1 0.45s var(--ease-out),
                --bar-hb-col 0.36s ease;
}
#container.panel-enter {
    animation: panel-reveal 0.34s var(--ease-out) both;
}
@keyframes panel-reveal {
    0% { opacity: 0; transform: translateY(7px) scale(0.99); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
/* Recomputing indicator: a solid bar pulsing along the top edge. */
#container.is-updating::after {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 2px;
    background: var(--rc);
    transform-origin: center;
    animation: panel-shimmer 0.85s ease-in-out infinite;
    pointer-events: none;
    z-index: 4;
}
@keyframes panel-shimmer {
    0% { opacity: 0.3; transform: scaleX(0.45); }
    50% { opacity: 1; transform: scaleX(1); }
    100% { opacity: 0.3; transform: scaleX(0.45); }
}

/* ---------- Map Summary Line ---------- */
#summary-row {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-height: 17px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    line-height: 1.35;
    font-size: 12px;
    transition: border-color 0.26s ease;
}
#summary-main {
    flex: 1 1 auto;
    min-width: 72px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#summary-main .s-artist { color: var(--text-dim); font-weight: 600; }
#summary-main .s-title { color: var(--text); font-weight: 700; }
#summary-main .s-diff { color: var(--text-dim); font-weight: 600; }
#summary-main .s-mapper { color: var(--text-faint); font-weight: 500; }
#summary-main .mq-track { display: inline-block; }
#summary-main .mq-track > span + span { margin-left: 6px; }
#summary-main.mq-run {
    text-overflow: clip;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 3px, #000 calc(100% - 14px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 3px, #000 calc(100% - 14px), transparent 100%);
}
#summary-main.mq-run .mq-track {
    animation: summary-mq var(--mq-dur, 10s) ease-in-out infinite;
    will-change: transform;
}
@keyframes summary-mq {
    0%, 14% { transform: translateX(0); }
    46%, 54% { transform: translateX(calc(-1 * var(--mq-dist, 0px))); }
    86%, 100% { transform: translateX(0); }
}
#summary-meta {
    flex: 0 0 auto;
    max-width: 62%;
    overflow: hidden;
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-size: 11px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
#summary-meta .s-keys {
    color: var(--text);
    font-weight: 700;
    font-size: 10.5px;
    padding: 0 5px;
    border-radius: 6px;
    background: var(--surface-strong);
    border: 1px solid var(--surface-border);
}

/* ---------- Hero Header ---------- */
#header {
    position: relative;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    row-gap: 5px;
}
#header-meta {
    margin-left: auto;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    min-width: 0;
}
#rating {
    flex: none;
    white-space: nowrap;
    font-size: var(--hero-size);
    font-weight: 700;
    color: var(--dim-text);
    letter-spacing: -0.5px;
    line-height: 1.02;
    font-variant-numeric: tabular-nums;
    margin-right: 2px;
    transition: color 0.24s ease, font-size 0.22s ease;
}
#rating::after {
    content: '\2605';
    font-size: 0.38em;
    font-weight: 700;
    opacity: 0.55;
    margin-left: 4px;
    vertical-align: 0.46em;
}
#type-badge,
#min-type-badge {
    flex: none;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--badge-ink);
    transition: background-color 0.26s ease, color 0.26s ease, transform 0.22s var(--ease-out);
}
#type-badge.rc,  #min-type-badge.rc  { background: var(--rc); }
#type-badge.ln,  #min-type-badge.ln  { background: var(--ln); }
#type-badge.hb,  #min-type-badge.hb  { background: var(--hb); }
#type-badge.mix, #min-type-badge.mix { background: var(--mix); }
#min-type-badge { align-self: center; }
.badge-pop {
    animation: badge-pop-in 0.26s var(--ease-out) both;
}
@keyframes badge-pop-in {
    0% { transform: scale(0.86); opacity: 0.55; }
    65% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}
#keys-badge {
    flex: none;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--pill-border);
    color: var(--text-dim);
    letter-spacing: 0.5px;
    transition: border-color 0.24s ease, color 0.24s ease;
}
#mod-badge {
    flex: none;
    white-space: nowrap;
    font-size: 11.5px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 6px;
    background: var(--pill);
    border: 1px solid var(--pill-border);
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
}

/* ---------- Cache Status Pill ---------- */
#cache-status {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 2px 8px 2px 7px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    white-space: nowrap;
    transition: color 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
}
#cache-status::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: background-color 0.25s ease;
}
#container[data-cache-state="saved"] #cache-status::before { background: #34d399; }
#container[data-cache-state="hit"] #cache-status::before { background: var(--rc); }
#container[data-cache-state="miss"] #cache-status::before { background: #fbbf24; }
#container[data-cache-state="unavailable"] #cache-status::before { background: #fb7185; }
#cache-status:empty { display: none; }
.cache-pulse {
    animation: cache-flash 0.36s var(--ease-out) both;
}
@keyframes cache-flash {
    0% { transform: scale(0.94); opacity: 0.55; }
    60% { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}

/* ---------- RC / LN Unified 2-Card Telemetry ---------- */
#dan-row {
    display: block;
}
#rc-ln-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
    line-height: 1.25;
}
#rc-ln-row .sub-item {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-rows: auto auto;
    align-items: baseline;
    column-gap: 8px;
    row-gap: 3px;
    padding: 8px 14px 9px 15px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    overflow: hidden;
    transition: background-color 0.24s ease, border-color 0.24s ease, padding 0.2s ease, opacity 0.28s ease;
}
/* Family stripe: the only colour on the card, encoding RC vs LN. */
#rc-ln-row .sub-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    transition: background-color 0.24s ease;
}
#rc-ln-row .sub-item.rc-sub::before { background: var(--rc); }
#rc-ln-row .sub-item.ln-sub::before { background: var(--ln); }
#rc-ln-row .sub-label {
    grid-column: 1;
    grid-row: 1;
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}
#rc-ln-row .rc-sub .sub-label { color: var(--rc); }
#rc-ln-row .ln-sub .sub-label { color: var(--ln); }
#rc-ln-row .sub-value {
    grid-column: 2;
    grid-row: 1;
    justify-self: end;
    font-weight: 700;
    font-size: var(--sub-size);
    line-height: 1.02;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.3px;
    transition: color 0.24s ease, font-size 0.22s ease, opacity 0.22s ease;
}
#rc-ln-row .sub-value.rc { color: var(--rc); }
#rc-ln-row .sub-value.ln { color: var(--ln); }
#rc-ln-row .dan-value {
    grid-column: 1 / 3;
    grid-row: 2;
    padding-top: 4px;
    border-top: 1px solid var(--rule);
    font-weight: 600;
    font-size: var(--dan-size);
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.24s ease, font-size 0.22s ease, opacity 0.22s ease;
}
#rc-ln-row .dan-value.rc-dan { color: var(--rc); }
#rc-ln-row .dan-value.ln-dan { color: var(--ln); }
#rc-ln-row .sep { display: none; }

/* Total Dan inline readout inside header */
#total-dan-wrap {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    white-space: nowrap;
}
#total-dan-wrap .td-sep {
    width: 1px;
    height: 11px;
    background: var(--rule);
    align-self: center;
    margin: 0 2px;
}
#total-dan-wrap .td-lbl {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
}
#total-dan {
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
}
.card-swap {
    animation: card-enter-in 0.34s var(--ease-out) calc(var(--card-i, 0) * 45ms) both;
}
@keyframes card-enter-in {
    0% { opacity: 0.4; transform: translateY(5px); }
    100% { opacity: 1; transform: translateY(0); }
}

/* ---------- Difficulty Curve Graph ---------- */
#curve-container {
    margin-top: 1px;
    position: relative;
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    transition: background-color 0.26s ease, border-color 0.26s ease;
}

#curve-canvas {
    display: block;
    width: 100%;
    height: var(--curve-h);
    cursor: crosshair;
    transition: height 0.22s ease;
}
#curve-tooltip {
    position: absolute;
    inset: 3px 4px auto;
    z-index: 1;
    min-height: 20px;
    border-radius: 4px;
    background: var(--panel-bg);
    width: fit-content;
    max-width: calc(100% - 8px);
    margin: 0 auto;
    padding: 2px 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    pointer-events: none;
    transition: opacity 0.14s ease;
}
#curve-tooltip span { flex: none; }


.divider {
    height: 1px;
    background: var(--rule);
    margin: 2px 0 1px;
    transition: opacity 0.26s ease;
}

/* ---------- Overall Pattern Tags ---------- */
#tags-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 20px;
}
.ov-tag {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 1 1 auto;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2.5px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    letter-spacing: 0.2px;
    white-space: nowrap;
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease, box-shadow 0.24s ease, transform 0.2s var(--ease-out);
}
.ov-share {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 1 1 auto;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    white-space: nowrap;
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease, box-shadow 0.24s ease, transform 0.2s var(--ease-out);
}
.ov-share .pct,
.ov-tag .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
.ov-share .pct { opacity: 0.7; margin-left: 4px; }
/* Live tag ring: a crisp outline, no glow. */
.ov-tag.is-live-tag,
.ov-share.is-live-tag {
    box-shadow: 0 0 0 1px currentColor;
}
.chip-enter {
    animation: chip-rise 0.22s var(--ease-out) calc(var(--chip-i, 0) * 20ms) both;
}
@keyframes chip-rise {
    0% { opacity: 0.3; transform: translateY(3px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---------- Live Segment Row ----------
   One left-aligned readout: tempo, tag, confidence; pattern and tempo
   model confidence are read in a single glance. Difficulty and duration
   are secondary and sit together at the right edge. */
#seg-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    row-gap: 4px;
    min-height: 28px;
    margin-top: 1px;
}
/* Secondary readouts stay together and drop to their own right-aligned
   line when the primary tag/BPM/conf cluster needs the full width. */
#seg-secondary {
    flex: none;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 9px;
}
#seg-row.is-break {
    padding: 3px 9px;
    background: var(--surface);
    border-radius: 8px;
    box-shadow: inset 0 0 0 1px var(--surface-border);
}
#seg-tag {
    flex: 0 1 auto;
    min-width: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.22s ease, opacity 0.22s ease;
}
#seg-tag .secondary {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-dim);
    margin-left: 6px;
}
#seg-bpm {
    flex: none;
    display: inline-flex;
    align-items: baseline;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: color 0.24s ease;
}

#seg-bpm:empty { display: none; }

#seg-conf {
    flex: none;
    display: inline-flex;
    align-items: baseline;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
}

#seg-conf:empty { display: none; }

.pill-pop {
    animation: pill-pop-in 0.22s var(--ease-out) both;
}
@keyframes pill-pop-in {
    0% { opacity: 0.35; transform: scale(0.90); }
    100% { opacity: 1; transform: scale(1); }
}

#seg-diff {
    flex: none;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 6px;
    background: var(--surface-strong);
    border: 1px solid var(--surface-border);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: border-color 0.24s ease, background-color 0.24s ease;
}
#seg-diff .sd-star {
    font-size: 13px;
    font-weight: 700;
    color: var(--segdiff);
}
#seg-diff .sd-star::after {
    content: '\2605';
    font-size: 9px;
    margin-left: 2px;
    opacity: 0.6;
}
#seg-diff .sd-dan {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
}
#seg-diff.rc { border-color: var(--rc); }
#seg-diff.ln { border-color: var(--ln); }
#seg-dur {
    flex: none;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
}
#seg-dur:empty { display: none; }

/* ---------- Segment Timeline ---------- */
#seg-timeline-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 2px;
}
#seg-timeline {
    position: relative;
    height: 14px;
    width: 100%;
    background: var(--chip-track);
    border: 1px solid var(--surface-border);
    border-radius: 4px;
    overflow: hidden;
}
.tl-seg {
    position: absolute;
    top: 0;
    height: 100%;
    opacity: 0.85;
    border-right: 1px solid rgba(0, 0, 0, 0.26);
    transition: opacity 0.2s ease, filter 0.2s ease;
}
.tl-seg:hover {
    opacity: 0.98;
    filter: brightness(1.14);
}
.tl-seg.tl-break { opacity: 0.24; }
.tl-seg.is-active-seg {
    opacity: 1;
    filter: brightness(1.2) saturate(1.12);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
}
#seg-cursor {
    position: absolute;
    top: -1px;
    width: 2px;
    height: 16px;
    background: var(--cursor);
    border-radius: 1px;
    z-index: 2;
    left: 0;
    pointer-events: none;
    transition: left 0.08s linear;
}
#seg-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 11px;
    font-size: 10.5px;
    color: var(--text-dim);
}
#seg-legend .lg-item {
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.2s ease, opacity 0.2s ease;
}
#seg-legend .lg-item.is-live-tag {
    color: var(--text);
    font-weight: 700;
}
#seg-legend .lg-item i {

    height: 7px;
    border-radius: 50%;
    transition: transform 0.2s var(--ease-out);
}

    transform: scale(1.28);
}

/* ---------- Loading State Card ---------- */
#loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--text-dim);
    text-align: center;
    padding: 18px 22px;
    min-width: 280px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--panel-radius);
    backdrop-filter: blur(10px);
    box-shadow: var(--panel-shadow);
}
#loading::before {
    content: '';
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid var(--surface-border);
    border-top-color: var(--rc);
    border-right-color: var(--ln);
    animation: spm-spin 0.9s linear infinite;
    flex: none;
}
@keyframes spm-spin {
    to { transform: rotate(360deg); }
}

/* ---------- Directional Odometer Digit Rolling & Text Morphing ---------- */
.d-slot {
    display: inline-block;
    position: relative;
    overflow: hidden;
    vertical-align: bottom;
    line-height: inherit;
}
.d-slot .d-cur {
    display: inline-block;
}
.d-slot.d-up::before,
.d-slot.d-down::before {
    content: attr(data-prev);
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    pointer-events: none;
}
.d-slot.d-up .d-cur,
.d-slot.d-up::before,
.d-slot.d-down .d-cur,
.d-slot.d-down::before,
.d-slot.d-enter .d-cur {
    will-change: transform, opacity;
}
.d-slot.d-up .d-cur {
    animation: d-roll-in-up 0.40s var(--ease-roll) calc(var(--d-i, 0) * 22ms) both;
}
.d-slot.d-up::before {
    animation: d-roll-out-up 0.40s var(--ease-roll) calc(var(--d-i, 0) * 22ms) both;
}
.d-slot.d-down .d-cur {
    animation: d-roll-in-down 0.40s var(--ease-roll) calc(var(--d-i, 0) * 22ms) both;
}
.d-slot.d-down::before {
    animation: d-roll-out-down 0.40s var(--ease-roll) calc(var(--d-i, 0) * 22ms) both;
}
.d-slot.d-enter .d-cur {
    animation: d-roll-in-up 0.36s var(--ease-roll) calc(var(--d-i, 0) * 18ms) both;
}
@keyframes d-roll-in-up {
    0% { transform: translateY(104%); opacity: 0.05; }
    100% { transform: translateY(0); opacity: 1; }
}
@keyframes d-roll-out-up {
    0% { transform: translateY(0); opacity: 0.9; }
    100% { transform: translateY(-104%); opacity: 0; }
}
@keyframes d-roll-in-down {
    0% { transform: translateY(-104%); opacity: 0.05; }
    100% { transform: translateY(0); opacity: 1; }
}
@keyframes d-roll-out-down {
    0% { transform: translateY(0); opacity: 0.9; }
    100% { transform: translateY(104%); opacity: 0; }
}
.bpm-bump {
    animation: bpm-glow 0.44s var(--ease-out) both;
}
@keyframes bpm-glow {
    0% { transform: scale(1); filter: brightness(1); }
    30% { transform: scale(1.06); filter: brightness(1.22); }
    100% { transform: scale(1); filter: brightness(1); }
}
.txt-morph {
    display: inline-block;
    animation: txt-flip-in 0.32s var(--ease-out) both;
}
@keyframes txt-flip-in {
    0% { opacity: 0.18; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
}
.seg-enter {
    animation: seg-slide-in 0.30s var(--ease-out) both;
}
@keyframes seg-slide-in {
    0% { opacity: 0.25; transform: translateX(-7px); }
    100% { opacity: 1; transform: translateX(0); }
}

/* ---------- Performance Switch: UI Animations OFF ---------- */
body.no-motion #container,
body.no-motion #container::before,
body.no-motion #container::after,
body.no-motion #container *,
body.no-motion #container *::before,

            ink = lighten(ink, CHIP_INK_LIFT);
        }
        return '#ffffff';
    }

    function computeFamilySplitPct(result, tagRes) {
        const fm = tagRes && tagRes.overall && tagRes.overall.familyMass;
        const fmTotal = fm ? (Number(fm.rc || 0) + Number(fm.ln || 0)) : 0;
        if (fmTotal > 0) {
            return Math.max(0, Math.min(100, (Number(fm.rc || 0) / fmTotal) * 100));
        }
        const mt = result && result.mapType;
        if (mt === 'LN') return 0;
        if (mt === 'RC') return 100;
        if (result && Number.isFinite(result.lnRatio)) {
            return Math.max(0, Math.min(100, (1 - result.lnRatio) * 100));
        }
        return 50;
    }

    /** Reflect both map family (RC/LN/HB/Mix) and TagClassifier RC/LN mass

    function updateTopAccent(mapType, result, tagRes) {
        const root = document.documentElement.style;
        const rcPct = computeFamilySplitPct(result || (mapType ? { mapType } : null), tagRes);
        const rcShare = rcPct / 100;
        const lnShare = 1 - rcShare;

        let s0, s1;
        if (rcPct >= 99.5) {
            s0 = 100;
            s1 = 100;
        } else if (rcPct <= 0.5) {
            s0 = 0;
            s1 = 0;
        } else {
            s0 = Math.max(0, rcPct - 2.5);
            s1 = Math.min(100, rcPct + 2.5);
        }
        root.setProperty('--bar-s0', s0.toFixed(1) + '%');
        root.setProperty('--bar-s1', s1.toFixed(1) + '%');

    /** Directional odometer digit roller.
     *  Keeps element.textContent equal to the raw target string at all times
     *  by storing outgoing digits in data-prev on ::before pseudo-elements. */
    function setRollingDigits(el, nextStr) {
        const s = nextStr == null ? '' : String(nextStr);
        const prev = el.dataset.rawVal ?? el.textContent ?? '';
        if (prev === s) return;
        el.dataset.rawVal = s;
        if (!settings.enableAnimations || !s) {
            el.textContent = s;
            return;
        }
        const numeric = str => parseFloat(str.replace(/[^0-9.-]/g, ''));
        const nNext = numeric(s);
        const prevHadNum = !!(prev && prev !== '--' && prev !== '-');
        const refPrev = prevHadNum ? prev : (el.dataset.lastNumVal || '');
        const refNum = numeric(refPrev);
        if (!Number.isFinite(nNext) || (prevHadNum && !Number.isFinite(refNum))) {
            // Restore the previous value so setMorphText can detect the change.
            el.dataset.rawVal = prev;
            setMorphText(el, s);
            return;
        }
        el.dataset.lastNumVal = s;
        const direction = Number.isFinite(refNum)
            ? (nNext >= refNum ? 'd-up' : 'd-down') : 'd-enter';
        const fragment = document.createDocumentFragment();
        let rollIdx = 0;
        for (let i = 0; i < s.length; i++) {
            const ch = s[i], prevIdx = refPrev.length - (s.length - i);
            const prevCh = prevIdx >= 0 ? refPrev[prevIdx] : '';
            const slot = document.createElement('span');
            const cur = document.createElement('span');
            cur.className = 'd-cur';
            cur.textContent = ch;
            slot.className = 'd-slot';
            if (/[0-9]/.test(ch) && (!prevHadNum || prevCh !== ch)) {
                slot.classList.add(direction);
                if (direction !== 'd-enter') slot.dataset.prev = /[0-9]/.test(prevCh) ? prevCh : '0';
                slot.style.setProperty('--d-i', String(rollIdx++));
            }
            slot.appendChild(cur);
            fragment.appendChild(slot);
        }
        el.replaceChildren(fragment);
        if (el === elSegBpm) {
            el.classList.remove('bpm-bump');
            void el.offsetWidth;
            el.classList.add('bpm-bump');
        }
    }

    function getModData(data) {
        const client = String(data?.client || '').toLowerCase();
        const modsCandidates = [data?.play?.mods, data?.menu?.mods, data?.resultsScreen?.mods];
        const validMods = modsCandidates.filter(Boolean);

        const modCodes = new Set();
        const modArrays = [];
        for (const mods of validMods) {
            if (typeof mods?.name === 'string') {
                const s = mods.name.toUpperCase().replace(/[^A-Z]/g, '');
                for (const [code] of Object.entries(MOD_BIT_FLAGS)) {
                    if (s.includes(code)) modCodes.add(code);
                }
            }
            if (typeof mods?.str === 'string') {
                const s = mods.str.toUpperCase().replace(/[^A-Z]/g, '');
                for (const [code] of Object.entries(MOD_BIT_FLAGS)) {
                    if (s.includes(code)) modCodes.add(code);
                }
            }
            const num = Number(mods?.number ?? mods?.num);
            if (Number.isFinite(num)) {
                for (const [code, bit] of Object.entries(MOD_BIT_FLAGS)) {
                    if ((num & bit) !== 0) modCodes.add(code);
                }
            }
            if (Array.isArray(mods?.array)) modArrays.push(mods.array);
        }

        for (const arr of modArrays) {
            for (const item of arr) {
                if (!item) continue;
                if (typeof item === 'string') {
                    const s = item.toUpperCase();
                    for (const [code] of Object.entries(MOD_BIT_FLAGS)) {
                        if (s.includes(code)) modCodes.add(code);
                    }
                } else if (typeof item?.acronym === 'string') {
                    const s = item.acronym.toUpperCase();
                    for (const [code] of Object.entries(MOD_BIT_FLAGS)) {
                        if (s.includes(code)) modCodes.add(code);
                    }
                }
            }
        }

        let speedRate = 1.0;
        let lazerSpeedChange = null;
        if (client === 'lazer') {
            for (const arr of modArrays) {
                for (const item of arr) {
                    if (!item || typeof item !== 'object') continue;
                    const sc = Number(item?.settings?.speed_change);
                    if (Number.isFinite(sc) && sc > 0) lazerSpeedChange = sc;
                }
            }
        }
        if (client === 'lazer' && Number.isFinite(lazerSpeedChange) && lazerSpeedChange > 0) {
            speedRate = lazerSpeedChange;
        } else if (modCodes.has('NC') || modCodes.has('DT')) {
            speedRate = 1.5;
        } else if (modCodes.has('HT') || modCodes.has('DC')) {
            speedRate = 0.75;
        }

        const sortedCodes = [...modCodes].sort();
        const modSignature = [client, String(speedRate), sortedCodes.join('+')].join('|');

        return { speedRate, modCodes: sortedCodes, modSignature };
    }

    function getInterpolatedTime() {
        if (songTimeMs === null || songTimeReceiveTs <= 0) return null;

        if (receiveDelta > 5 && songDelta >= 0 && Math.abs(songDelta) <= 4000) {
            rate = songDelta / receiveDelta;
        }
        rate = Math.max(0, Math.min(rate, 5));
        return songTimeMs + rate * (now - songTimeReceiveTs);
    }

    function safeMax(arr) {

        return m;

    /** Linearly resampled interpolation between two curves of arbitrary lengths. */
    const morphBuffers = {};
    function lerpSeries(a, b, t, key) {
        if (!b || !b.length) return b;
        if (t >= 1) return b;
        const len = b.length;
        const out = morphBuffers[key]?.length === len ? morphBuffers[key]
            : (morphBuffers[key] = new Float64Array(len));
        if (!a || !a.length) {
            for (let i = 0; i < len; i++) out[i] = b[i] * t;
            return out;
        }
        const prevLen = a.length;
        for (let i = 0; i < len; i++) {
            let v0;
            if (prevLen === len) {
                v0 = a[i];
            } else {
                const pos = (i / Math.max(1, len - 1)) * (prevLen - 1);
                const lo = Math.floor(pos), hi = Math.min(prevLen - 1, lo + 1);
                const f = pos - lo;
                const aLo = Number.isFinite(a[lo]) ? a[lo] : 0;
                const aHi = Number.isFinite(a[hi]) ? a[hi] : aLo;
                v0 = aLo + (aHi - aLo) * f;
            }
            if (!Number.isFinite(v0)) v0 = b[i];
            out[i] = v0 + (b[i] - v0) * t;
        }
        return out;
    }

    function sampleSeriesAtTime(data, sectionTimes, tMs, mapStart, mapEndT) {
        if (!data || !data.length) return 0;
        const len = data.length;
        if (!sectionTimes || !sectionTimes.length) {
            const frac = Math.max(0, Math.min(1, (tMs - mapStart) / Math.max(1, mapEndT - mapStart)));
            const pos = frac * (len - 1);
            const lo = Math.floor(pos), hi = Math.min(len - 1, lo + 1);
            return data[lo] + (data[hi] - data[lo]) * (pos - lo);
        }
        const n = Math.min(len, sectionTimes.length);
        if (tMs <= sectionTimes[0]) return data[0];
        if (tMs >= sectionTimes[n - 1]) return data[n - 1];
        let lo = 0, hi = n - 1;
        while (lo + 1 < hi) {
            const m = (lo + hi) >> 1;
            if (sectionTimes[m] <= tMs) lo = m;
            else hi = m;
        }
        const dt = sectionTimes[hi] - sectionTimes[lo];
        const f = dt > 0 ? Math.max(0, Math.min(1, (tMs - sectionTimes[lo]) / dt)) : 0;
        return data[lo] + (data[hi] - data[lo]) * f;
    }

    function drawStaticCurveLayer(targetCanvas, w, h, dpr, sectionDiffs, rcSectionDiffs, lnSectionDiffs, mapType, sectionTimes, firstNoteTime, lastNoteTime, scaleMax) {
        const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
        if (targetCanvas.width !== bw || targetCanvas.height !== bh) {
            targetCanvas.width = bw;
            targetCanvas.height = bh;
        }
        const ctx = targetCanvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const pad = 4;
        const yTop = 12;
        const yBot = h - 5;
        const plotH = Math.max(8, yBot - yTop);
        const isMix = mapType === 'Mix';
        const showBoth = rcSectionDiffs && rcSectionDiffs.length > 0 && lnSectionDiffs && lnSectionDiffs.length > 0;

        const mapStart = firstNoteTime != null ? firstNoteTime : (sectionTimes && sectionTimes.length ? sectionTimes[0] : 0);
        const mapEndT = lastNoteTime != null ? lastNoteTime : (sectionTimes && sectionTimes.length ? sectionTimes[sectionTimes.length - 1] + 400 : 0);
        const timeSpan = Math.max(1, mapEndT - mapStart);
        const hasTimes = !!(sectionTimes && sectionTimes.length);
        function xAt(i, len) {
            if (hasTimes && i < sectionTimes.length) {
                const t = Math.max(mapStart, Math.min(sectionTimes[i], mapEndT));
                return pad + ((t - mapStart) / timeSpan) * (w - 2 * pad);
            }
            return pad + (i / Math.max(len - 1, 1)) * (w - 2 * pad);
        }

        // Solid hairline reference grid + baseline
        ctx.save();
        ctx.lineWidth = 1;
        for (const frac of [0.25, 0.50, 0.75]) {
            const gy = Math.round(yTop + frac * plotH) + 0.5;
            ctx.strokeStyle = CANVAS_INK.grid;
            ctx.beginPath();
            ctx.moveTo(pad, gy);
            ctx.lineTo(w - pad, gy);
            ctx.stroke();
        }
        ctx.strokeStyle = CANVAS_INK.baseline;
        ctx.beginPath();
        ctx.moveTo(pad, Math.round(yBot) + 0.5);
        ctx.lineTo(w - pad, Math.round(yBot) + 0.5);
        ctx.stroke();
        ctx.restore();

        function paintSeries(data, color, alpha, maxRef) {
            if (!data || data.length === 0) return;
            const len = data.length;

            ctx.beginPath();
            ctx.moveTo(xAt(0, len), yBot);
            for (let i = 0; i < len; i++) {
                const y = yBot - Math.min(1, Math.max(0, data[i] / maxRef)) * plotH;
                ctx.lineTo(xAt(i, len), y);
            }
            ctx.lineTo(xAt(len - 1, len), yBot);
            ctx.closePath();
            ctx.fillStyle = hexA(color, alpha * 0.10);
            ctx.fill();

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 1.6;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            for (let i = 0; i < len; i++) {
                const x = xAt(i, len);
                const y = yBot - Math.min(1, Math.max(0, data[i] / maxRef)) * plotH;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        if (showBoth) {
            const allMax = scaleMax > 0 ? scaleMax
                : Math.max(safeMax(rcSectionDiffs), safeMax(lnSectionDiffs), 0.01);
            paintSeries(rcSectionDiffs, FAMILY.rc, 0.88, allMax);
            if (lnSectionDiffs && lnSectionDiffs.length > 0) {
                paintSeries(lnSectionDiffs, FAMILY.ln, 0.92, allMax);
            }
        } else if (sectionDiffs && sectionDiffs.length > 0) {
            const maxVal = scaleMax > 0 ? scaleMax : Math.max(safeMax(sectionDiffs), 0.01);
            const curveColor = mapType === 'LN' ? FAMILY.ln : (isMix ? FAMILY.mix : FAMILY.rc);
            paintSeries(sectionDiffs, curveColor, 0.92, maxVal);
        }

    }

    function drawCurve(sectionDiffs, rcSectionDiffs, mapType, cursorTimeMs, sectionTimes, firstNoteTime, lastNoteTime, lnSectionDiffs) {
        const canvas = elCanvas;
        // Layout dimensions stay stable while the panel animates with transforms.
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!(w > 8)) return;
        const dpr = window.devicePixelRatio || 1;
        const pad = 4;
        const yTop = 12;
        const yBot = h - 5;
        const plotH = Math.max(8, yBot - yTop);

        const showBoth = rcSectionDiffs && rcSectionDiffs.length > 0 && lnSectionDiffs && lnSectionDiffs.length > 0;

        const mapStart = firstNoteTime != null ? firstNoteTime : (sectionTimes && sectionTimes.length ? sectionTimes[0] : 0);
        const mapEndT = lastNoteTime != null ? lastNoteTime : (sectionTimes && sectionTimes.length ? sectionTimes[sectionTimes.length - 1] + 400 : 0);
        const timeSpan = Math.max(1, mapEndT - mapStart);

        let cursorX = -1;
        let clampedTime = mapStart;
        if (cursorTimeMs !== null && sectionTimes && sectionTimes.length > 0) {
            clampedTime = Math.max(mapStart, Math.min(cursorTimeMs, mapEndT));
            cursorX = pad + ((clampedTime - mapStart) / timeSpan) * (w - 2 * pad);
        }

        let morphT = 1;
        if (settings.enableAnimations && curveMorphFrom && curveMorphStartTs > 0) {
            const elapsed = performance.now() - curveMorphStartTs;
            if (elapsed < CURVE_MORPH_MS) {
                const u = Math.max(0, Math.min(1, elapsed / CURVE_MORPH_MS));
                morphT = 1 - Math.pow(1 - u, 3);
                offscreenValid = false;
            } else {
                curveMorphFrom = null;
                curveMorphStartTs = 0;
            }
        } else {
            curveMorphFrom = null;
            curveMorphStartTs = 0;
        }

        const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
        if (canvas.width !== bw || canvas.height !== bh) {
            canvas.width = bw;
            canvas.height = bh;
            offscreenValid = false;
        }

        if (offscreenValid && morphT >= 1 && hoverRatioX === null
            && Math.abs(cursorX - lastDrawnCursorX) < 0.15 && isPaused === lastDrawnPaused) {
            return;
        }
        lastDrawnCursorX = cursorX;
        lastDrawnPaused = isPaused;

        const drawSec = morphT < 1 ? lerpSeries(curveMorphFrom.sec, sectionDiffs, morphT, 'sec') : sectionDiffs;
        const drawRc = morphT < 1 ? lerpSeries(curveMorphFrom.rc, rcSectionDiffs, morphT, 'rc') : rcSectionDiffs;
        const drawLn = morphT < 1 && lnSectionDiffs ? lerpSeries(curveMorphFrom.ln, lnSectionDiffs, morphT, 'ln') : lnSectionDiffs;
        const drawScale = morphT < 1 && curveMorphFrom.scale > 0
            ? curveMorphFrom.scale + (curveScaleMax - curveMorphFrom.scale) * morphT
            : curveScaleMax;

        if (!offscreenCanvas) offscreenCanvas = document.createElement('canvas');
        if (!offscreenValid) {
            drawStaticCurveLayer(offscreenCanvas, w, h, dpr, drawSec, drawRc, drawLn, mapType, sectionTimes, firstNoteTime, lastNoteTime, drawScale);
            if (morphT >= 1) offscreenValid = true;
        }

        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        ctx.drawImage(offscreenCanvas, 0, 0, w, h);

        // Hover scrubbing crosshair
        if (hoverRatioX !== null && sectionTimes && sectionTimes.length > 0) {
            const hx = pad + hoverRatioX * (w - 2 * pad);
            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.setLineDash([2, 3]);
            ctx.lineWidth = 1;
            ctx.moveTo(hx, yTop);
            ctx.lineTo(hx, yBot);
            ctx.stroke();
            ctx.restore();
        }

        // Playhead beam, intersection dots & status cap
        if (cursorX >= 0) {
            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = CANVAS_INK.cursor;
            ctx.globalAlpha = 0.78;
            ctx.lineWidth = 1.5;
            ctx.moveTo(cursorX, yTop);
            ctx.lineTo(cursorX, yBot);
            ctx.stroke();

            // Live curve intersection nodes
            const maxRef = drawScale > 0 ? drawScale
                : Math.max(showBoth ? Math.max(safeMax(drawRc || []), safeMax(drawLn || [])) : safeMax(drawSec || []), 0.01);
            function drawDot(series, color) {
                if (!series || !series.length) return;
                const val = sampleSeriesAtTime(series, sectionTimes, clampedTime, mapStart, mapEndT);
                if (val <= 0.01 && series === drawLn) return;
                const y = yBot - Math.min(1, Math.max(0, val / maxRef)) * plotH;
                ctx.beginPath();
                ctx.globalAlpha = 0.95;
                ctx.fillStyle = color;
                ctx.arc(cursorX, y, 3.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.fillStyle = '#ffffff';
                ctx.arc(cursorX, y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            if (showBoth) {
                drawDot(drawRc, FAMILY.rc);
                drawDot(drawLn, FAMILY.ln);
            } else if (drawSec && drawSec.length) {
                const curveColor = mapType === 'LN' ? FAMILY.ln : (mapType === 'Mix' ? FAMILY.mix : FAMILY.rc);
                drawDot(drawSec, curveColor);
            }

            if (isPaused) {
                ctx.fillStyle = CANVAS_INK.cursor;
                ctx.globalAlpha = 0.94;
                ctx.fillRect(cursorX - 3.4, 2, 2.1, 6);
                ctx.fillRect(cursorX + 1.3, 2, 2.1, 6);
            } else {
                ctx.beginPath();
                ctx.fillStyle = CANVAS_INK.cursor;
                ctx.globalAlpha = 0.96;
                ctx.arc(cursorX, 4.8, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    // Hover scrubbing preview on curve canvas
    elCanvas.addEventListener('mousemove', (ev) => {
        if (!cachedResult || !cachedResult.sectionTimes || !cachedResult.sectionTimes.length) return;
        const rect = elCanvas.getBoundingClientRect();
        if (!(rect.width > 8)) return;
        const pad = 4;
        const ratio = Math.max(0, Math.min(1, (ev.clientX - rect.left - pad) / Math.max(1, rect.width - 2 * pad)));
        hoverRatioX = ratio;
        const st = cachedResult.sectionTimes;
        const mapStart = cachedResult.firstNoteTime != null ? cachedResult.firstNoteTime : st[0];
        const mapEndT = cachedResult.lastNoteTime != null ? cachedResult.lastNoteTime : st[st.length - 1] + 400;
        const tMs = mapStart + ratio * Math.max(1, mapEndT - mapStart);
        let bIdx = 0, hi = st.length - 1;
        while (bIdx < hi) {
            const mid = (bIdx + hi + 1) >> 1;
            if (st[mid] <= tMs) bIdx = mid;
            else hi = mid - 1;
        }
        const rcV = cachedResult.rcSectionDifficulties && cachedResult.rcSectionDifficulties[bIdx];
        const lnV = cachedResult.lnSectionDifficulties && cachedResult.lnSectionDifficulties[bIdx];
        const secV = cachedResult.sectionDifficulties && cachedResult.sectionDifficulties[bIdx];
        const parts = [fmtTimeShort(Math.max(0, tMs))];
        if (rcV != null && lnV != null && cachedResult.lnSectionDifficulties.length > 0) {
            parts.push('RC ' + rcV.toFixed(2) + '\u2605');
            if (lnV > 0.05) parts.push('LN ' + lnV.toFixed(2) + '\u2605');
        } else if (secV != null) {
            parts.push(secV.toFixed(2) + '\u2605');
        }
        if (cachedTagResult && cachedTagResult.segments) {
            const sIdx = findSegment(cachedTagResult.segments, tMs);
            if (sIdx >= 0) parts.push(tagLabel(cachedTagResult.segments[sIdx].tag));
        }
        elCurveTooltip.innerHTML = '';
        for (const p of parts) {
            const s = document.createElement('span');
            s.textContent = p;
            elCurveTooltip.appendChild(s);
        }
        elCurveTooltip.classList.remove('hidden');
        elCurveContainer.classList.add('is-hovering');
        drawCurve(
            cachedResult.sectionDifficulties, cachedResult.rcSectionDifficulties,
            cachedResult.mapType, getInterpolatedTime(), cachedResult.sectionTimes,
            cachedResult.firstNoteTime, cachedResult.lastNoteTime, cachedResult.lnSectionDifficulties
        );
    });
    elCanvas.addEventListener('mouseleave', () => {
        if (hoverRatioX === null) return;
        hoverRatioX = null;
        elCurveTooltip.classList.add('hidden');
        elCurveContainer.classList.remove('is-hovering');
        lastDrawnCursorX = -999;
        if (cachedResult) {
            drawCurve(
                cachedResult.sectionDifficulties, cachedResult.rcSectionDifficulties,
                cachedResult.mapType, getInterpolatedTime(), cachedResult.sectionTimes,
                cachedResult.firstNoteTime, cachedResult.lastNoteTime, cachedResult.lnSectionDifficulties
            );
        }
    });

    // ---- v0.5.0: segment classification rendering ----

    function fmtTimeShort(ms) {
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return m + ':' + String(s).padStart(2, '0');
    }

    function fmtDuration(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        const m = Math.floor(total / 60);
        if (m < 60) return m + ':' + String(total % 60).padStart(2, '0');
        return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
    }

    // SPMTagClassifier: retain each native path's percentage semantics.
    function renderOverallTags(tagRes) {
        elTagsRow.innerHTML = '';
        elTagsRow.title = '';
        const overall = tagRes && tagRes.overall;
        if (!overall) return;
        const coarse = tagRes.modelInfo.taxonomy === 'coarse5';
        const percentages = coarse
            ? Object.fromEntries(Object.entries(overall.composition).map(([tag, share]) => [tag, 100 * share]))
            : overall.percentages;
        const labelPercentages = coarse ? percentages : overall.labelPercentages;
        if (!percentages) return;

        const sig = JSON.stringify([settings.colorScheme, overall.tags, percentages, overall.familyMass]);
        const animateEnter = settings.enableAnimations && sig !== lastTagSig;
        lastTagSig = sig;

        let chipIdx = 0;
        for (const tag of overall.tags || []) {
            const c = tagColor(tag), chip = document.createElement('span');
            chip.className = 'ov-tag' + (animateEnter ? ' chip-enter' : '');
            if (animateEnter) chip.style.setProperty('--chip-i', String(chipIdx++));
            chip.dataset.tagKey = tag;
            chip.style.background = hexA(c, CHIP_TINT_ALPHA);
            chip.style.borderColor = hexA(c, CHIP_BORDER_ALPHA);
            chip.style.color = chipInk(c);
            chip.textContent = tagLabel(tag);
            elTagsRow.appendChild(chip);
        }
        const tags = overall.tags || [];
        const meaning = coarse
            ? 'Weighted morphology composition: duration × relative physical effort × local concentration'
            : overall.perception.difficultyAvailable
            ? 'Integrated branch support × SPM difficulty burden × action load'
            : 'Integrated branch support × action load (no difficulty input)';
        elTagsRow.title = meaning + (coarse
            ? '; five classes sum to 100%, not correctness probability. Solid = dominant morphology.'
            : '; overlapping burden shares, not accuracy or time share. Solid = selected by prior-aware tag gates, not simply the highest percentage.');
        if (!tags.length) {
            const unknown = document.createElement('span');
            unknown.textContent = 'No dominant pattern'; unknown.style.fontSize = '11.5px';
            unknown.title = coarse ? 'No active morphology support' : 'No branch selected by the whole-map tag gates';
            elTagsRow.appendChild(unknown);
        }
        [...elTagsRow.querySelectorAll('.ov-tag')].forEach((chip, i) => {
            const tag = tags[i], pct = document.createElement('span');
            pct.className = 'pct'; pct.style.marginLeft = '5px';
            if (tag === 'hybrid') {
                const total = overall.familyMass.rc + overall.familyMass.ln;
                if (total > 0) {
                    const rcPct = Math.round(100 * overall.familyMass.rc / total);
                    pct.textContent = 'RC ' + rcPct + '% / LN ' + (100 - rcPct) + '%';
                } else {
                    pct.textContent = 'RC — / LN —';
                }
                chip.title = 'Hybrid: relative RC / LN family burden shares (sum = 100%)';
            } else {
                pct.textContent = Math.round(labelPercentages[tag] || 0) + '%';
                chip.title = tag === 'rc mix' || tag === 'ln mix'
                    ? 'Family burden share covered by this mix' : meaning + (coarse
                        ? '; dominant morphology' : '; selected by prior-aware tag gates, not percentage rank alone');
            }
            chip.appendChild(pct);
        });
        let shown = tags.length;
        for (const [tag, share] of Object.entries(percentages).sort((a,b) => b[1]-a[1])) {
            if (shown >= 4) break;
            if (tags.includes(tag) || share < 1) continue;
            const c = tagColor(tag), chip = document.createElement('span');
            chip.className = 'ov-share' + (animateEnter ? ' chip-enter' : '');
            if (animateEnter) chip.style.setProperty('--chip-i', String(chipIdx++));
            chip.dataset.tagKey = tag;
            chip.style.borderColor = hexA(c, CHIP_BORDER_ALPHA);
            chip.style.color = chipInk(c); chip.textContent = tagLabel(tag);
            chip.title = coarse ? 'Secondary weighted morphology composition; not the dominant class'
                : 'Secondary branch burden share; not selected by the prior-aware whole-map tag gates';
            const pct = document.createElement('span'); pct.className = 'pct';
            pct.textContent = Math.round(share) + '%'; chip.appendChild(pct);
            elTagsRow.appendChild(chip); shown++;
        }
    }

    function makeLegendDot(color) {
        const dot = document.createElement('i');
        dot.style.background = color;
        return dot;
    }
    function renderSegTimeline(tagRes) {
        elTimeline.querySelectorAll('.tl-seg').forEach((n) => n.remove());
        elSegLegend.innerHTML = '';
        if (!tagRes) return;
        const first = tagRes.map.firstNote, last = tagRes.map.lastNote;
        const span = Math.max(1, last - first);
        const used = [];
        for (let i = 0; i < tagRes.segments.length; i++) {
            const seg = tagRes.segments[i];
            const d = document.createElement('div');
            d.className = 'tl-seg' + (seg.tag === 'break' ? ' tl-break' : '');
            d.dataset.segIdx = String(i);
            d.style.left = (((seg.start - first) / span) * 100) + '%';
            d.style.width = Math.max(0.15, ((seg.end - seg.start) / span) * 100) + '%';
            d.style.background = tagColor(seg.tag);
            d.title = fmtTimeShort(seg.start) + ' ' + tagLabel(seg.tag)
                + (segmentBpm(seg) ? ' @' + segmentBpm(seg) : '')
                + segDifficultyTip(i);
            elTimeline.appendChild(d);
            if (seg.tag !== 'break' && !used.includes(seg.tag)) used.push(seg.tag);
        }
        elTimeline.appendChild(elSegCursor);
        for (const t of used) {
            const item = document.createElement('span');
            item.className = 'lg-item';
            item.dataset.tagKey = t;
            item.appendChild(makeLegendDot(tagColor(t)));
            item.appendChild(document.createTextNode(tagLabel(t)));
            elSegLegend.appendChild(item);
        }
    }

    const CADENCE_TAGS = new Set([
        'dense chordstream', 'fast chordstream', 'stamina',
        'chordjack', 'minijack', 'jack', 'speed', 'density', 'coordination',
    ]);
    function segmentBpm(seg) {
        return CADENCE_TAGS.has(seg.tag) && Number.isFinite(seg.equivBpm) && seg.equivBpm > 0
            ? String(seg.equivBpm) : '';
    }

    function segDifficultyTip(idx) {
        if (!settings.showSegmentDiff || !cachedSegStats || !cachedSegStats[idx]) return '';
        const seg = cachedTagResult && cachedTagResult.segments[idx];
        if (seg && seg.tag === 'break') return '';
        const s = cachedSegStats[idx];
        if (!(s.mean > segmentDiffFloor)) return '';
        return ' — ' + s.mean.toFixed(2) + '\u2605';
    }

    function findSegment(segments, t) {
        let lo = 0, hi = segments.length - 1, ans = -1;
        while (lo <= hi) {
            const m = (lo + hi) >> 1;
            if (segments[m].start <= t) { ans = m; lo = m + 1; }
            else hi = m - 1;
        }
        if (ans < 0 || t >= segments[ans].end) return -1;
        return ans;
    }

    function renderSegDiff(idx) {
        const stat = cachedSegStats && idx >= 0 ? cachedSegStats[idx] : null;
        const seg = cachedTagResult && idx >= 0 ? cachedTagResult.segments[idx] : null;
        if (!settings.showSegmentDiff || !stat || !seg || seg.tag === 'break'
            || !(stat.mean > segmentDiffFloor)) {
            elSegDiff.classList.add('hidden');
            elSegDiff.removeAttribute('title');
            return;
        }
        const kind = segKind(idx);
        const danTxt = stat.dan != null
            ? SPMEngine.danLevelToLabel(stat.dan, cachedKeyCount, kind, danStyleKey())
            : '';
        const wasHidden = elSegDiff.classList.contains('hidden');
        elSegDiff.className = kind === 'LN' ? 'ln' : 'rc';
        setRollingDigits(elSegDiffStar, stat.mean.toFixed(2));
        setMorphText(elSegDiffDan, danTxt);
        if (settings.enableAnimations && wasHidden) {
            elSegDiff.classList.add('pill-pop');
        }
        elSegDiff.title = 'Segment difficulty (mean of the section curve: '
            + stat.mean.toFixed(2) + '\u2605)'
            + (danTxt ? '\n' + kind + ' dan: ' + danTxt : '');
    }

    function segKind(idx) {
        const seg = cachedTagResult && cachedTagResult.segments[idx];
        return seg && seg.family === 'ln' ? 'LN' : 'RC';
    }

    /** Highlight overall tag chips, legend items and timeline bar matching the active segment. */
    function syncActiveSegmentHighlight(idx, activeTag) {
        const tag = activeTag && activeTag !== 'break' ? activeTag : '';
        elTagsRow.querySelectorAll('[data-tag-key]').forEach((n) => {
            n.classList.toggle('is-live-tag', !!tag && n.dataset.tagKey === tag);
        });
        elSegLegend.querySelectorAll('.lg-item').forEach((n) => {
            n.classList.toggle('is-live-tag', !!tag && n.dataset.tagKey === tag);
        });
        elTimeline.querySelectorAll('.tl-seg').forEach((n) => {
            n.classList.toggle('is-active-seg', idx >= 0 && n.dataset.segIdx === String(idx));
        });
    }

    /** Per-frame: current segment row + timeline cursor. */
    function updateSegmentLive(cursorTime) {
        if (!cachedTagResult || cursorTime === null) return;
        const segments = cachedTagResult.segments;
        const idx = findSegment(segments, cursorTime);

        if (idx !== lastSegIndex) {
            const hadPrev = lastSegIndex >= -1;
            lastSegIndex = idx;
            let activeTag = '';
            if (idx < 0) {
                elSegRow.classList.remove('is-break');
                elSegTag.textContent = '—';
                elSegTag.style.color = 'var(--text-faint)';
                elSegTag.style.opacity = '1';
                setRollingDigits(elSegBpm, '');
                setRollingDigits(elSegConf, '');
                setRollingDigits(elSegDur, '');
            } else {
                const seg = segments[idx];
                activeTag = seg.tag;
                if (seg.tag === 'break') {
                    elSegRow.classList.add('is-break');
                    elSegTag.textContent = settings.showBreak ? 'Break' : '—';
                    elSegTag.style.color = 'var(--break-text)';
                    elSegTag.style.opacity = '1';
                    setRollingDigits(elSegBpm, '');
                    setRollingDigits(elSegConf, '');
                } else {
                    elSegRow.classList.remove('is-break');
                    const c = tagColor(seg.tag);
                    elSegTag.textContent = tagLabel(seg.tag);
                    if (seg.secondary) {
                        const sec = document.createElement('span');
                        sec.className = 'secondary';
                        sec.textContent = '+ ' + tagLabel(seg.secondary);
                        elSegTag.appendChild(sec);
                    }
                    elSegTag.style.color = c;
                    elSegTag.style.opacity = seg.confidence < 0.45 ? '0.6' : '1';
                    setRollingDigits(elSegBpm, segmentBpm(seg));
                    setRollingDigits(elSegConf, Math.round(seg.confidence * 100) + '%');
                }
                setRollingDigits(elSegDur, ((seg.end - seg.start) / 1000).toFixed(1) + 's');
                if (settings.enableAnimations && hadPrev) {
                    elSegTag.classList.remove('seg-enter');
                    void elSegTag.offsetWidth;
                    elSegTag.classList.add('seg-enter');
                }
            }
            syncActiveSegmentHighlight(idx, activeTag);
            renderSegDiff(idx);
        }

        const first = cachedTagResult.map.firstNote, last = cachedTagResult.map.lastNote;
        const pct = Math.max(0, Math.min(100, ((cursorTime - first) / Math.max(1, last - first)) * 100));
        if (Math.abs(pct - lastCursorPct) >= 0.03) {
            lastCursorPct = pct;
            elSegCursor.style.left = pct + '%';
        }
    }

    function updateSummaryMarquee() {
        const track = elSummaryMain.firstChild;
        elSummaryMain.classList.remove('mq-run');
        elSummaryMain.style.removeProperty('--mq-dist');
        elSummaryMain.style.removeProperty('--mq-dur');
        if (!track || !track.classList || !track.classList.contains('mq-track')) return;
        const box = elSummaryMain.clientWidth;
        if (box === 0) return;
        const overflow = track.scrollWidth - box;
        if (overflow <= 2) return;
        const dist = Math.ceil(overflow) + 6;
        const dur = Math.min(30, Math.max(6, dist / 45 / 0.32));
        elSummaryMain.style.setProperty('--mq-dist', dist + 'px');
        elSummaryMain.style.setProperty('--mq-dur', dur.toFixed(2) + 's');
        elSummaryMain.classList.add('mq-run');
    }

    function renderSummary() {
        if (!settings.showSummary) {
            elSummaryRow.classList.add('hidden');
            return;
        }
        const frame = cachedPayloadMeta || {};
        const meta = cachedMeta || {};
        const artist = frame.artist || meta.artist || '';
        const title = frame.title || meta.title || '';
        const version = frame.version || meta.version || '';
        const mapper = frame.mapper || meta.creator || '';

        elSummaryMain.innerHTML = '';
        elSummaryMeta.innerHTML = '';
        const track = document.createElement('span');
        track.className = 'mq-track';
        elSummaryMain.appendChild(track);
        let mainParts = 0;
        const add = (cls, text) => {
            if (!text) return;
            const s = document.createElement('span');
            s.className = cls;
            s.textContent = text;
            track.appendChild(s);
            mainParts++;
        };
        add('s-artist', artist);
        add('s-title', title);
        add('s-diff', version ? '[' + version + ']' : '');
        add('s-mapper', mapper ? 'by ' + mapper : '');

        const keys = frame.keyCount || meta.keyCount;
        const objects = frame.objects || meta.objects;
        const rate = currentSpeedRate || 1;
        const bpmSrc = meta.bpm ? { bpm: meta.bpm, min: meta.bpmMin, max: meta.bpmMax, scale: rate }
            : { bpm: frame.bpm, min: frame.bpmMin, max: frame.bpmMax, scale: 1 };
        const durationMs = cachedResult && cachedResult.lastNoteTime > cachedResult.firstNoteTime
            ? cachedResult.lastNoteTime - cachedResult.firstNoteTime
            : (frame.durationMs != null ? frame.durationMs
                : (meta.durationMs > 0 ? meta.durationMs / rate : 0));

        elSummaryMeta.innerHTML = '';
        const facts = [];
        if (keys) facts.push({ text: keys + 'K', cls: 's-keys' });
        if (bpmSrc.bpm) {
            const bpm = Math.round(bpmSrc.bpm * bpmSrc.scale);
            const bpmMin = bpmSrc.min && Math.round(bpmSrc.min * bpmSrc.scale);
            const bpmMax = bpmSrc.max && Math.round(bpmSrc.max * bpmSrc.scale);
            const varies = bpmMin && bpmMax && bpmMax - bpmMin >= 2
                && bpm !== bpmMin && bpm !== bpmMax;
            facts.push({ text: varies ? bpmMin + '\u2013' + bpmMax + ' BPM' : bpm + ' BPM' });
        }
        if (durationMs > 0) facts.push({ text: fmtDuration(durationMs) });
        if (objects) {
            const lnPct = cachedResult && cachedResult.lnCount > 0
                ? Math.round((cachedResult.lnRatio || 0) * 100) : 0;
            facts.push({ text: objects + ' obj' + (lnPct > 0 ? ' (' + lnPct + '% LN)' : '') });
        }
        const od = meta.od != null ? meta.od : (cachedResult ? cachedResult.od : null);
        if (Number.isFinite(od)) facts.push({ text: 'OD ' + (Math.round(od * 10) / 10) });
        while (facts.length) {
            elSummaryMeta.innerHTML = '';
            facts.forEach((f) => {
                const s = document.createElement('span');
                if (f.cls) s.className = f.cls;
                s.textContent = f.text;
                elSummaryMeta.appendChild(s);
            });
            if (elSummaryMeta.scrollWidth <= elSummaryMeta.clientWidth + 1
                || facts.length === 1 || elSummaryMeta.clientWidth === 0) break;
            facts.pop();
        }
        updateSummaryMarquee();
        elSummaryRow.classList.toggle('hidden', facts.length === 0 && mainParts === 0);
    }

    function applyClassificationVisibility() {
        const classified = !!(cachedResult && cachedResult.classified);
        elTypeBadge.classList.toggle('hidden', !classified);
        elKeysBadge.classList.toggle('hidden', classified);
        if (!classified) {
            elKeysBadge.textContent = cachedKeyCount + 'K';
        }
        elTagsRow.classList.toggle('hidden', !classified || !settings.showTags);
        elSegRow.classList.toggle('hidden', !classified || !settings.showSegmentTag);
        elTimelineWrap.classList.toggle('hidden', !classified || !settings.showTimeline);
        if (!classified || !settings.showSegmentTag) {
            elSegDiff.classList.add('hidden');
        }
        const anyPatternVisible = classified &&
            (settings.showTags || settings.showSegmentTag || settings.showTimeline);
        elDivider.classList.toggle('hidden', !anyPatternVisible);
    }

    function capturePayloadMeta(data) {
        const bm = data && data.beatmap;
        if (!bm) return;
        const clean = (v) => (typeof v === 'string' && v.trim() && v.trim() !== '-' ? v.trim() : '');
        const prev = cachedPayloadMeta || {};
        const next = {
            artist: clean(bm.artistUnicode) || clean(bm.artist) || prev.artist || '',
            title: clean(bm.titleUnicode) || clean(bm.title) || prev.title || '',
            version: clean(bm.version) || prev.version || '',
            mapper: clean(bm.mapper) || prev.mapper || '',
        };
        const st = bm.stats || {};
        const cs = st.cs ? Number(st.cs.original) : NaN;
        if (Number.isFinite(cs) && cs > 0) next.keyCount = Math.round(cs);
        const bpm = st.bpm || {};
        const common = Number(bpm.common), lo = Number(bpm.min), hi = Number(bpm.max);
        if (Number.isFinite(common) && common > 0) {
            next.bpm = Math.round(common);
            if (Number.isFinite(lo) && Number.isFinite(hi) && lo > 0 && hi > 0) {
                next.bpmMin = Math.round(lo);
                next.bpmMax = Math.round(hi);
            }
        }
        const objs = st.objects ? Number(st.objects.total) : NaN;
        if (Number.isFinite(objs) && objs > 0) next.objects = objs;
        const t = bm.time || {};
        const first = Number(t.firstObject), last = Number(t.lastObject);
        if (Number.isFinite(first) && Number.isFinite(last) && last > first) {
            next.durationMs = last - first;
        }
        const merged = Object.assign({}, prev, next);
        if (JSON.stringify(merged) !== JSON.stringify(prev)) {
            cachedPayloadMeta = merged;
            renderSummary();
        }
    }

    function triggerCardSwap() {

        drawCurve(
            result.sectionDifficulties, result.rcSectionDifficulties, result.mapType,
